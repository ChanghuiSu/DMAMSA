mode: train

common:
  dataset: nih
  modalities: [PRE, ART]
  profile: false
  gpu_id: "0"
  ckpt_dir: "./checkpoints/nih_dmamsa/"

  use_gpu: true
  num_refinement_blocks: 9
  start_slice: 2
  end_slice: -2
  img_height: 256
  img_width: 256
  channels: 1
  data_list: "./data_list/nih_shuffled.txt"
  dataroot: "../dataset/MRISegmenter_T1only_public/train_PREandART/"

train:
  n_epochs: 300
  decay_epoch: 100
  batch_size: 96
  lr: 0.0002
  debugging: false

  start_num: 0
  end_num: 120
  start_num_val: 120
  end_num_val: 135
  b1: 0.5
  b2: 0.999
  n_cpu: 16
  epoch: 0
  checkpoint_interval: 5
  lambda_id: 100.0

test:
  phase_index: all
  dataroot: "../dataset/MRISegmenter_T1only_public/test_PREandART/"
  data_list: "./data_list/nih_test.txt"
  which_epoch: 300

  notes: ""  # Output directory suffix
  start_num: 0
  end_num: 60
